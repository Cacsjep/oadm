<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OADM Loading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #141414;
    --card: #181818;
    --text: #F2F2F2;
    --muted: #9A9A9A;
    --accent: #6C5CE7;
    --accent-hover: #7D6EF0;
    --brand: #5B2D8E;
    --duration: 4s;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid;
    place-items: center;
    overflow: hidden;
  }

  .splash {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    animation: splash-out .45s ease-in calc(var(--duration) - .45s) forwards;
  }

  /* soft violet glow behind the logo, breathing once the logo is complete */
  .glow {
    position: absolute;
    top: 30px;
    width: 340px; height: 340px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(108,92,231,.38) 0%, rgba(108,92,231,.10) 45%, rgba(108,92,231,0) 70%);
    filter: blur(8px);
    opacity: 0;
    transform: scale(.6);
    animation: glow-in 1.2s ease-out .9s forwards, glow-breathe 2.4s ease-in-out 2.1s infinite;
  }

  svg.logo { width: 260px; height: 260px; overflow: visible; position: relative; }

  /* every hexagon: drawn as a violet outline, then filled */
  .hex path {
    fill: var(--text);
    fill-opacity: 0;
    stroke: var(--accent);
    stroke-width: 3;
    stroke-linejoin: round;
    stroke-dasharray: 320;
    stroke-dashoffset: 320;
  }
  .hex {
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    animation: hex-in .7s cubic-bezier(.2,.9,.25,1.15) var(--delay) forwards;
  }
  .hex path {
    animation:
      draw .55s ease-out var(--delay) forwards,
      fill .45s ease-out calc(var(--delay) + .45s) forwards;
  }

  /* the lens in the middle: an iris that opens, then a single "shutter" blink */
  .lens-ring {
    fill: none;
    stroke: var(--brand);
    stroke-width: 5;
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    animation: lens-ring .6s ease-out 1.55s forwards;
  }
  .lens {
    fill: var(--brand);
    transform-box: fill-box;
    transform-origin: center;
    transform: scale(0);
    animation: lens-open .55s cubic-bezier(.3,1.6,.5,1) 1.7s forwards, lens-blink .5s ease-in-out 2.9s;
  }

  /* scanning ring sweeping once around the logo */
  .scan {
    fill: none;
    stroke: var(--accent-hover);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-dasharray: 90 900;
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    animation: scan 1.6s ease-in-out 2.0s forwards;
  }

  .wordmark {
    text-align: center;
    opacity: 0;
    transform: translateY(8px);
    animation: rise .6s ease-out 2.1s forwards;
  }
  .wordmark h1 {
    margin: 0;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: .5em;
    padding-left: .5em; /* keeps the spaced word centered */
    animation: tighten 1s cubic-bezier(.2,.8,.2,1) 2.1s forwards;
  }
  .wordmark p {
    margin: 8px 0 0;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: .04em;
  }

  .progress {
    width: 220px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
    opacity: 0;
    animation: rise .4s ease-out .3s forwards;
  }
  .bar {
    width: 100%;
    height: 3px;
    border-radius: 3px;
    background: #2A2A2A;
    overflow: hidden;
  }
  .bar span {
    display: block;
    height: 100%;
    width: 0;
    border-radius: 3px;
    background: var(--accent);
    box-shadow: 0 0 10px rgba(108,92,231,.7);
    animation: fill-bar calc(var(--duration) - .6s) cubic-bezier(.45,.05,.3,1) .3s forwards;
  }
  .status {
    font-size: 12px;
    color: var(--muted);
    height: 16px;
  }

  .replay {
    position: fixed;
    bottom: 20px; right: 20px;
    background: #2A2A2A;
    color: var(--text);
    border: 0;
    border-radius: 8px;
    padding: 8px 14px;
    font: 600 12px Inter, system-ui, sans-serif;
    cursor: pointer;
    opacity: .7;
  }
  .replay:hover { opacity: 1; background: #333; }

  @keyframes hex-in {
    0%   { opacity: 0; transform: translate(var(--fx), var(--fy)) scale(.4) rotate(-30deg); }
    60%  { opacity: 1; }
    100% { opacity: 1; transform: translate(0, 0) scale(1) rotate(0); }
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes fill { to { fill-opacity: 1; stroke-opacity: 0; } }
  @keyframes lens-ring { from { opacity: 0; transform: scale(1.8); } to { opacity: 1; transform: scale(1); } }
  @keyframes lens-open { to { transform: scale(1); } }
  @keyframes lens-blink { 0%, 100% { transform: scale(1); } 50% { transform: scale(.35); } }
  @keyframes scan {
    0%   { opacity: 0; transform: rotate(0); }
    15%  { opacity: .9; }
    85%  { opacity: .9; }
    100% { opacity: 0; transform: rotate(360deg); }
  }
  @keyframes glow-in { to { opacity: 1; transform: scale(1); } }
  @keyframes glow-breathe { 0%, 100% { filter: blur(8px) brightness(1); } 50% { filter: blur(12px) brightness(1.35); } }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }
  @keyframes tighten { to { letter-spacing: .18em; padding-left: .18em; } }
  @keyframes fill-bar { to { width: 100%; } }
  @keyframes splash-out { to { opacity: 0; transform: scale(1.04); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; }
  }
</style>
</head>
<body>
  <div class="splash" id="splash">
    <div class="glow"></div>
    <svg class="logo" viewBox="-160 -160 320 320" aria-label="OADM logo" id="logo">
      <circle class="scan" r="150" />
    </svg>
    <div class="wordmark">
      <h1>OADM</h1>
      <p>Open AXIS Device Management</p>
    </div>
    <div class="progress">
      <div class="bar"><span></span></div>
      <div class="status" id="status">Starting</div>
    </div>
  </div>
  <button class="replay" id="replay">Replay</button>

<script>
  // The app icon: seven pointy-top hexagons (center + six around it), a lens dot in the middle.
  const R = 54;                       // hexagon circumradius
  const GAP = 7;                      // gap between hexagons
  const D = Math.sqrt(3) * R + GAP;   // distance between neighbor centers
  const svg = document.getElementById('logo');
  const ns = 'http://www.w3.org/2000/svg';

  function hexPath(r) {
    const pts = [];
    for (let i = 0; i < 6; i++) {
      const a = (Math.PI / 180) * (60 * i - 90); // vertex at the top
      pts.push([r * Math.cos(a), r * Math.sin(a)]);
    }
    // slightly rounded corners like the icon
    const k = 0.14;
    let d = '';
    for (let i = 0; i < 6; i++) {
      const p = pts[i], n = pts[(i + 1) % 6], prev = pts[(i + 5) % 6];
      const a = [p[0] + (prev[0] - p[0]) * k, p[1] + (prev[1] - p[1]) * k];
      const b = [p[0] + (n[0] - p[0]) * k, p[1] + (n[1] - p[1]) * k];
      d += (i === 0 ? 'M' : 'L') + a[0].toFixed(2) + ' ' + a[1].toFixed(2) + ' Q' + p[0].toFixed(2) + ' ' + p[1].toFixed(2) + ' ' + b[0].toFixed(2) + ' ' + b[1].toFixed(2) + ' ';
    }
    return d + 'Z';
  }

  function addHex(cx, cy, delay, flyFrom) {
    const g = document.createElementNS(ns, 'g'); // position only; the inner group animates
    g.setAttribute('transform', `translate(${cx} ${cy})`);
    const inner = document.createElementNS(ns, 'g');
    inner.setAttribute('class', 'hex');
    inner.style.setProperty('--delay', delay + 's');
    inner.style.setProperty('--fx', flyFrom[0] + 'px');
    inner.style.setProperty('--fy', flyFrom[1] + 'px');
    const path = document.createElementNS(ns, 'path');
    path.setAttribute('d', hexPath(R));
    inner.appendChild(path);
    g.appendChild(inner);
    svg.appendChild(g);
  }

  function build() {
    svg.querySelectorAll('g').forEach(g => g.remove());
    // six outer hexagons, clockwise from the top left, each flying in from further out
    const order = [240, 300, 0, 60, 120, 180];
    order.forEach((deg, i) => {
      const a = deg * Math.PI / 180;
      const x = D * Math.cos(a), y = D * Math.sin(a);
      addHex(x, y, 0.25 + i * 0.13, [x * 0.9, y * 0.9]);
    });
    // center hexagon last, then the lens
    addHex(0, 0, 1.15, [0, 0]);
    const lensGroup = document.createElementNS(ns, 'g');
    const ring = document.createElementNS(ns, 'circle');
    ring.setAttribute('class', 'lens-ring'); ring.setAttribute('r', '25');
    const lens = document.createElementNS(ns, 'circle');
    lens.setAttribute('class', 'lens'); lens.setAttribute('r', '18');
    lensGroup.append(ring, lens);
    svg.appendChild(lensGroup);
    svg.appendChild(svg.querySelector('.scan')); // scan ring on top
  }

  // status texts along the 4 seconds
  const steps = [[0, 'Starting'], [900, 'Connecting to server'], [1900, 'Loading plugins'], [2900, 'Loading devices'], [3500, 'Ready']];
  let timers = [];
  function runStatus() {
    timers.forEach(clearTimeout);
    const el = document.getElementById('status');
    timers = steps.map(([t, text]) => setTimeout(() => { el.textContent = text; }, t));
  }

  function play() {
    const splash = document.getElementById('splash');
    build();
    // restart every CSS animation
    splash.style.animation = 'none';
    splash.querySelectorAll('*').forEach(e => { e.getAnimations?.().forEach(a => { a.cancel(); a.play(); }); });
    void splash.offsetWidth;
    splash.style.animation = '';
    runStatus();
  }

  document.getElementById('replay').addEventListener('click', play);
  build();
  runStatus();
</script>
</body>
</html>
