syntax = "proto3";
package oadm.v1;
option csharp_namespace = "Oadm.Contracts.V1";
import "Protos/common.proto";
import "google/protobuf/timestamp.proto";

service SettingsService {
  rpc Get (Empty) returns (ServerSettings);
  rpc Set (ServerSettings) returns (ServerSettings);
  // Credential list: user name + password pairs the server tries on discovered devices. Passwords
  // are stored encrypted and never returned.
  rpc ListCredentials (Empty) returns (CredentialList);
  rpc AddCredential (AddCredentialRequest) returns (CredentialEntry);   // INVALID_ARGUMENT, RESOURCE_EXHAUSTED (list full)
  rpc RemoveCredential (CredentialEntryId) returns (Empty);              // NOT_FOUND
}

message ServerSettings {
  int32 polling_interval_seconds = 1;   // default 60
  int32 scan_parallelism = 2;           // default 32
  int32 scan_timeout_ms = 3;            // default 1500
  string server_name = 4;
  string listen_url = 5;
  int32 full_refresh_minutes = 6;       // default 10, 1..1440
  // Devices.UseHostName: add devices by host name when known, else by IP. Default false.
  // optional so a partial Set without it keeps the stored value.
  optional bool use_host_name = 7;
}

message CredentialEntry {
  string id = 1;
  string user_name = 2;
  google.protobuf.Timestamp created = 3;
}

message CredentialList { repeated CredentialEntry entries = 1; }

message AddCredentialRequest {
  string user_name = 1;
  string password = 2;
}

message CredentialEntryId { string id = 1; }
