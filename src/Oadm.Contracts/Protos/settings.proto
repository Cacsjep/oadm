syntax = "proto3";
package oadm.v1;
option csharp_namespace = "Oadm.Contracts.V1";
import "Protos/common.proto";
import "google/protobuf/timestamp.proto";

service SettingsService {
  rpc Get (Empty) returns (ServerSettings);
  rpc Set (ServerSettings) returns (ServerSettings);
  // Credential list: user name + password pairs the server tries on discovered devices. Passwords
  // are stored encrypted and returned only by RevealCredential.
  rpc ListCredentials (Empty) returns (CredentialList);
  rpc AddCredential (AddCredentialRequest) returns (CredentialEntry);   // INVALID_ARGUMENT, RESOURCE_EXHAUSTED (list full)
  rpc RemoveCredential (CredentialEntryId) returns (Empty);              // NOT_FOUND
  // The stored password of one credential list entry, on the technician's explicit request (Settings page eye
  // and copy buttons; user decision 2026-10-08, to be restricted to administrators once client login exists).
  // Logged without the password. Device passwords are never returned. NOT_FOUND.
  rpc RevealCredential (CredentialEntryId) returns (RevealedCredential);
}

message RevealedCredential { string password = 1; }

message ServerSettings {
  int32 polling_interval_seconds = 1;   // default 60
  int32 scan_parallelism = 2;           // default 32
  int32 scan_timeout_ms = 3;            // default 1500
  string server_name = 4;
  string listen_url = 5;
  int32 full_refresh_minutes = 6;       // default 10, 1..1440
  // Devices.UseHostName: add devices by host name when known, else by IP. Default false.
  // optional so a partial Set without it keeps the stored value.
  optional bool use_host_name = 7;
  // Discovery.ZeroConfSeconds: a zero-conf scan of the add page ends after this many seconds. Default 30,
  // 5..300; 0 in a Set keeps the stored value.
  int32 zero_conf_seconds = 8;
  // Tasks.MaxParallelPerPlugin: how many tasks (= devices) of one task plugin run at the same time.
  // Default 16, 1..256; a plugin's MaxParallelDevices can only lower it. Applies to tasks started after
  // the change. optional so a partial Set without it keeps the stored value.
  optional int32 max_parallel_tasks_per_plugin = 9;
}

message CredentialEntry {
  string id = 1;
  string user_name = 2;
  google.protobuf.Timestamp created = 3;
}

message CredentialList { repeated CredentialEntry entries = 1; }

message AddCredentialRequest {
  string user_name = 1;
  string password = 2;
}

message CredentialEntryId { string id = 1; }
