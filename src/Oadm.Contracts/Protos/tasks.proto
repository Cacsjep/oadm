syntax = "proto3";
package oadm.v1;
option csharp_namespace = "Oadm.Contracts.V1";
import "Protos/common.proto";
import "Protos/devices.proto";
import "Protos/plugins.proto";
import "google/protobuf/timestamp.proto";

// ListTaskPluginsRequest, ListTasksRequest and WatchTasksRequest replaced Empty; they are wire compatible
// with it (a request without fields keeps the former behavior).
service TaskService {
  rpc ListTaskPlugins (ListTaskPluginsRequest) returns (TaskPluginList);
  // The same entries as ListTaskPlugins, one message per plugin: at 100,000 devices one list can pass the client's 32 MB
  // message limit (about 2 MB of ids per plugin that runs on half the devices), one plugin never does.
  rpc StreamTaskPlugins (ListTaskPluginsRequest) returns (stream TaskPluginInfo);
  rpc Run (RunTaskRequest) returns (RunTaskReply);   // one transaction for all tasks of the Run
  // Newest first. limit 0 = every task (legacy; with 50,000 tasks that is one huge message).
  rpc List (ListTasksRequest) returns (TaskList);
  // Starts with a snapshot (every active task plus the newest snapshot_limit finished ones, 0 = all),
  // then SNAPSHOT_END when asked for, then live changes (coalesced per task for a slow reader).
  rpc Watch (WatchTasksRequest) returns (stream TaskChanged);
  rpc Cancel (TaskIdRequest) returns (Empty);
  rpc Delete (TaskIdRequest) returns (Empty);
  rpc DeleteAll (Empty) returns (DeleteAllReply);   // cancels running tasks first, then one bulk delete
  rpc GetLog (TaskIdRequest) returns (TaskLog);     // per-task log, oldest first
  // Read-only plugin query for task dialogs (ITaskPluginQuery), 30 s timeout. Errors: NOT_FOUND,
  // UNIMPLEMENTED (plugin has no queries), FAILED_PRECONDITION (incompatible device, certificate
  // changed, credentials), UNAVAILABLE, DEADLINE_EXCEEDED, INVALID_ARGUMENT; the status detail is
  // the message for the user.
  rpc Query (TaskQueryRequest) returns (TaskQueryReply);
  // What a Run would do, nothing is written (the preview of the tools, docs/spec/mcp.md "Tasks"): the payload checked by the
  // plugin (ValidatePayload), the filter resolved to a fixed device list in the caller's view, each device to run or skipped
  // with a reason (PlanAsync, cached data only), the task name and the warnings. The checks of Run (unknown plugin, page task,
  // the run's permissions); an invalid payload answers its field errors, never an error status.
  rpc Plan (PlanTaskRequest) returns (TaskPlanReply);
  // The result file a task kept (ITaskExecutionContext.SaveResultFileAsync, docs/spec/mcp.md "Files"): its name, type and size.
  // Only for the user or access key that started the task, and administrators; NOT_FOUND for a task outside the caller's view,
  // one of another user and one without a file (the same answer).
  rpc GetResultFile (TaskIdRequest) returns (TaskResultFile);
  // The bytes of that file: the first message carries file_name and length, the others data (256 KB at most), uncompressed.
  // The same rules and answers as GetResultFile; audited "Downloaded file".
  rpc DownloadResult (TaskIdRequest) returns (stream DownloadChunk);
}

message TaskResultFile {
  string task_id = 1;
  string file_name = 2;
  string content_type = 3;
  int64 size = 4;
  google.protobuf.Timestamp saved = 5;
}

message TaskPluginInfo {
  string id = 1;
  string display_name = 2;
  string icon_key = 3;
  bool show_in_toolbar = 4;
  bool requires_dialog = 5;
  string owner_core_plugin_id = 6;          // set when contributed by a core plugin
  repeated string runnable_device_ids = 7;  // devices for which CanRun is true (empty when runnable_on_all_except)
  string group = 8;                         // context menu submenu (TaskGroups), never empty
  // Compact form, only for ListTaskPluginsRequest.compact: CanRun is true for every device except
  // not_runnable_device_ids. 5,000 devices x 10 plugins are otherwise 50,000 ids per call.
  bool runnable_on_all_except = 9;
  repeated string not_runnable_device_ids = 10;
  // Why the plugin cannot run on the not-runnable devices (ITaskPlugin.NotSupportedReason), grouped by reason,
  // most devices first. Every not-runnable device belongs to exactly one group; device ids are never sent twice:
  // - runnable_on_all_except: not_runnable_device_ids are sorted by group in this order, each group takes the next
  //   `count` of them and lists no ids itself.
  // - otherwise: each group lists its device_ids, except the one group with other_devices (the most common reason),
  //   which covers every device that is neither runnable nor listed in another group.
  // Empty from older servers: the client shows "Not supported on this device".
  repeated NotRunnableGroup not_runnable_groups = 11;
  // With ListTaskPluginsRequest.with_payload_schema: the JSON Schema of the payload (ITaskPlugin.PayloadType); empty when the
  // task is not offered to the tools (no payload type, a secret in it, or a schema without bounds).
  string payload_schema_json = 12;
  // With ListTaskPluginsRequest.filter: the devices of the filter the task can run on (no id lists are sent; the groups
  // count the others).
  int32 runnable_count = 13;
  // ITaskPlugin.IsDestructive: the entry sits last in its context menu group, after a separator.
  bool destructive = 14;
}

message NotRunnableGroup {
  string reason = 1;                  // plain language, at most 160 characters; may end with " (this device ...)"
  repeated string device_ids = 2;     // see TaskPluginInfo.not_runnable_groups
  int32 count = 3;                    // devices with this reason (always set)
  bool other_devices = 4;             // see TaskPluginInfo.not_runnable_groups
}

message ListTaskPluginsRequest {
  // Per plugin the shorter of runnable_device_ids or runnable_on_all_except + not_runnable_device_ids.
  // Without it runnable_device_ids is always filled (former behavior).
  bool compact = 1;
  bool with_payload_schema = 2;   // each plugin with payload_schema_json
  DeviceFilter filter = 3;        // set: only the counts within the filter's devices (runnable_count, not_runnable_groups)
}

message ListTasksRequest {
  int32 limit = 1;    // page size, 0 = all tasks
  int32 offset = 2;   // tasks to skip, newest first
}

message WatchTasksRequest {
  int32 snapshot_limit = 1;       // finished tasks in the snapshot (newest first), 0 = all; active tasks always
  bool snapshot_end_marker = 2;   // send a TaskChanged with kind SNAPSHOT_END (no task) after the snapshot
}
message TaskPluginList { repeated TaskPluginInfo plugins = 1; }

message RunTaskRequest {
  string plugin_id = 1;
  repeated string device_ids = 2;
  string payload_json = 3;
  string owner = 4;
}
// One task per device; all tasks of one Run share a batch id.
message RunTaskReply {
  string task_id = 1 [deprecated = true];   // first of task_ids, kept for compatibility
  repeated string task_ids = 2;             // in device order
  string batch_id = 3;                      // the run (every task of it carries this batch id)
}

message PlanTaskRequest {
  string plugin_id = 1;
  DeviceFilter filter = 2;    // the devices: resolved in the caller's view, sorted by address
  string payload_json = 3;
  // Only the payload's check, the secrets' fields included (a value the person entered is checked here, in memory only):
  // the errors and nothing else; no device is read.
  bool check_only = 4;
}

// A secret the run needs that an agent never sends (ITaskPlugin.SecretsOf): the person enters it, the run's payload has it
// at field. Never a value.
message TaskSecretSlot {
  string name = 1;   // lower case words with underscores
  string label = 2;  // what the person is asked for, lower case ("password", "PKCS#12 password")
  string field = 3;  // where it goes in the payload ("password", "settings[2].value")
}

message PayloadFieldError {
  string field = 1;    // the payload's JSON name, nested with dots; empty for the whole payload
  string message = 2;  // the dialog's text
}

message TaskPlanReply {
  repeated PayloadFieldError errors = 1;  // the payload is not valid: nothing else is set
  string task_name = 2;
  int32 device_count = 3;                 // the devices of the filter
  repeated string run_device_ids = 4;     // the devices a Run would change, in address order
  repeated NotRunnableGroup skipped = 5;  // the others by reason (count only), most devices first
  repeated string warnings = 6;
  repeated PlanFile files = 7;            // the uploaded files the run would use (name and SHA-256 from the upload store)
  repeated TaskSecretSlot secrets = 8;    // the secrets the run needs; the payload's errors at their fields are left out
  repeated string details = 9;            // what the run does in plain lines (the build of each device group), from the plan
}
message PlanFile {
  string name = 1;
  string sha256 = 2;
}
message TaskIdRequest { string task_id = 1; }
message DeleteAllReply { int32 deleted = 1; }

enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  QUEUED = 1;
  RUNNING = 2;
  DONE = 3;
  FAILED = 4;
  CANCELLED = 5;
  DONE_WITH_WARNINGS = 6;
}

message TaskDeviceResult {
  string device_id = 1;
  TaskState state = 2;
  string message = 3;
  int32 progress = 4;
}

enum TaskStepState {
  TASK_STEP_STATE_UNSPECIFIED = 0;
  TASK_STEP_STATE_PENDING = 1;
  TASK_STEP_STATE_RUNNING = 2;
  TASK_STEP_STATE_DONE = 3;
  TASK_STEP_STATE_WARNING = 4;
  TASK_STEP_STATE_SKIPPED = 5;
  TASK_STEP_STATE_FAILED = 6;
}

// One named step of a task (ITaskExecutionContext.PlanSteps / BeginStep), e.g. "Upload AXIS OS to the device".
message TaskStep {
  int32 index = 1;                          // position in TaskInfo.steps, 0-based
  string name = 2;
  TaskStepState state = 3;
  string detail = 4;                        // result, progress detail, skip reason or error
  int32 progress = 5;                       // 0-100
  google.protobuf.Timestamp started = 6;    // unset when the step never started
  google.protobuf.Timestamp finished = 7;
}

message TaskInfo {
  string id = 1;
  string plugin_id = 2;
  string name = 3;
  TaskState state = 4;
  string owner = 5;
  google.protobuf.Timestamp created = 6;
  google.protobuf.Timestamp started = 7;
  google.protobuf.Timestamp finished = 8;
  int32 progress = 9;
  repeated TaskDeviceResult devices = 10;   // always exactly one entry (one task per device)
  string batch_id = 11;                     // shared by the tasks started by one Run
  string device_id = 12;                    // the task's device (= devices[0].device_id)
  repeated TaskStep steps = 13;             // in order; empty when the plugin reports no steps
  int32 current_step_index = 14;            // running step, else the last started/ended one; -1 none
}
message TaskList {
  repeated TaskInfo tasks = 1;
  int32 total_count = 2;   // tasks in the history (for paging)
}

enum TaskLogLevel {
  TASK_LOG_LEVEL_UNSPECIFIED = 0;
  TASK_LOG_LEVEL_INFO = 1;
  TASK_LOG_LEVEL_WARNING = 2;
  TASK_LOG_LEVEL_ERROR = 3;
}

message TaskLogEntry {
  google.protobuf.Timestamp time = 1;
  string device_id = 2;   // empty for task-level entries
  TaskLogLevel level = 3;
  string message = 4;
}
message TaskLog { repeated TaskLogEntry entries = 1; }

message TaskQueryRequest {
  string plugin_id = 1;
  string device_id = 2;
  string method = 3;
  string payload_json = 4;
}
message TaskQueryReply { string payload_json = 1; }

message TaskChanged {
  // SNAPSHOT_END only when WatchTasksRequest.snapshot_end_marker is set; it carries no task.
  enum Kind { KIND_UNSPECIFIED = 0; ADDED = 1; UPDATED = 2; REMOVED = 3; SNAPSHOT_END = 4; }
  Kind kind = 1;
  TaskInfo task = 2;
}
