syntax = "proto3";
package oadm.v1;
option csharp_namespace = "Oadm.Contracts.V1";
import "Protos/common.proto";
import "google/protobuf/timestamp.proto";

// ListTaskPluginsRequest, ListTasksRequest and WatchTasksRequest replaced Empty; they are wire compatible
// with it (a request without fields keeps the former behavior).
service TaskService {
  rpc ListTaskPlugins (ListTaskPluginsRequest) returns (TaskPluginList);
  rpc Run (RunTaskRequest) returns (RunTaskReply);   // one transaction for all tasks of the Run
  // Newest first. limit 0 = every task (legacy; with 50,000 tasks that is one huge message).
  rpc List (ListTasksRequest) returns (TaskList);
  // Starts with a snapshot (every active task plus the newest snapshot_limit finished ones, 0 = all),
  // then SNAPSHOT_END when asked for, then live changes (coalesced per task for a slow reader).
  rpc Watch (WatchTasksRequest) returns (stream TaskChanged);
  rpc Cancel (TaskIdRequest) returns (Empty);
  rpc Delete (TaskIdRequest) returns (Empty);
  rpc DeleteAll (Empty) returns (DeleteAllReply);   // cancels running tasks first, then one bulk delete
  rpc GetLog (TaskIdRequest) returns (TaskLog);     // per-task log, oldest first
  // Read-only plugin query for task dialogs (ITaskPluginQuery), 30 s timeout. Errors: NOT_FOUND,
  // UNIMPLEMENTED (plugin has no queries), FAILED_PRECONDITION (incompatible device, certificate
  // changed, credentials), UNAVAILABLE, DEADLINE_EXCEEDED, INVALID_ARGUMENT; the status detail is
  // the message for the user.
  rpc Query (TaskQueryRequest) returns (TaskQueryReply);
}

message TaskPluginInfo {
  string id = 1;
  string display_name = 2;
  string icon_key = 3;
  bool show_in_toolbar = 4;
  bool requires_dialog = 5;
  string owner_core_plugin_id = 6;          // set when contributed by a core plugin
  repeated string runnable_device_ids = 7;  // devices for which CanRun is true (empty when runnable_on_all_except)
  string group = 8;                         // context menu submenu (TaskGroups), never empty
  // Compact form, only for ListTaskPluginsRequest.compact: CanRun is true for every device except
  // not_runnable_device_ids. 5,000 devices x 10 plugins are otherwise 50,000 ids per call.
  bool runnable_on_all_except = 9;
  repeated string not_runnable_device_ids = 10;
}

message ListTaskPluginsRequest {
  // Per plugin the shorter of runnable_device_ids or runnable_on_all_except + not_runnable_device_ids.
  // Without it runnable_device_ids is always filled (former behavior).
  bool compact = 1;
}

message ListTasksRequest {
  int32 limit = 1;    // page size, 0 = all tasks
  int32 offset = 2;   // tasks to skip, newest first
}

message WatchTasksRequest {
  int32 snapshot_limit = 1;       // finished tasks in the snapshot (newest first), 0 = all; active tasks always
  bool snapshot_end_marker = 2;   // send a TaskChanged with kind SNAPSHOT_END (no task) after the snapshot
}
message TaskPluginList { repeated TaskPluginInfo plugins = 1; }

message RunTaskRequest {
  string plugin_id = 1;
  repeated string device_ids = 2;
  string payload_json = 3;
  string owner = 4;
}
// One task per device; all tasks of one Run share a batch id.
message RunTaskReply {
  string task_id = 1 [deprecated = true];   // first of task_ids, kept for compatibility
  repeated string task_ids = 2;             // in device order
}
message TaskIdRequest { string task_id = 1; }
message DeleteAllReply { int32 deleted = 1; }

enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  QUEUED = 1;
  RUNNING = 2;
  DONE = 3;
  FAILED = 4;
  CANCELLED = 5;
  DONE_WITH_WARNINGS = 6;
}

message TaskDeviceResult {
  string device_id = 1;
  TaskState state = 2;
  string message = 3;
  int32 progress = 4;
}

enum TaskStepState {
  TASK_STEP_STATE_UNSPECIFIED = 0;
  TASK_STEP_STATE_PENDING = 1;
  TASK_STEP_STATE_RUNNING = 2;
  TASK_STEP_STATE_DONE = 3;
  TASK_STEP_STATE_WARNING = 4;
  TASK_STEP_STATE_SKIPPED = 5;
  TASK_STEP_STATE_FAILED = 6;
}

// One named step of a task (ITaskExecutionContext.PlanSteps / BeginStep), e.g. "Upload firmware".
message TaskStep {
  int32 index = 1;                          // position in TaskInfo.steps, 0-based
  string name = 2;
  TaskStepState state = 3;
  string detail = 4;                        // result, progress detail, skip reason or error
  int32 progress = 5;                       // 0-100
  google.protobuf.Timestamp started = 6;    // unset when the step never started
  google.protobuf.Timestamp finished = 7;
}

message TaskInfo {
  string id = 1;
  string plugin_id = 2;
  string name = 3;
  TaskState state = 4;
  string owner = 5;
  google.protobuf.Timestamp created = 6;
  google.protobuf.Timestamp started = 7;
  google.protobuf.Timestamp finished = 8;
  int32 progress = 9;
  repeated TaskDeviceResult devices = 10;   // always exactly one entry (one task per device)
  string batch_id = 11;                     // shared by the tasks started by one Run
  string device_id = 12;                    // the task's device (= devices[0].device_id)
  repeated TaskStep steps = 13;             // in order; empty when the plugin reports no steps
  int32 current_step_index = 14;            // running step, else the last started/ended one; -1 none
}
message TaskList {
  repeated TaskInfo tasks = 1;
  int32 total_count = 2;   // tasks in the history (for paging)
}

enum TaskLogLevel {
  TASK_LOG_LEVEL_UNSPECIFIED = 0;
  TASK_LOG_LEVEL_INFO = 1;
  TASK_LOG_LEVEL_WARNING = 2;
  TASK_LOG_LEVEL_ERROR = 3;
}

message TaskLogEntry {
  google.protobuf.Timestamp time = 1;
  string device_id = 2;   // empty for task-level entries
  TaskLogLevel level = 3;
  string message = 4;
}
message TaskLog { repeated TaskLogEntry entries = 1; }

message TaskQueryRequest {
  string plugin_id = 1;
  string device_id = 2;
  string method = 3;
  string payload_json = 4;
}
message TaskQueryReply { string payload_json = 1; }

message TaskChanged {
  // SNAPSHOT_END only when WatchTasksRequest.snapshot_end_marker is set; it carries no task.
  enum Kind { KIND_UNSPECIFIED = 0; ADDED = 1; UPDATED = 2; REMOVED = 3; SNAPSHOT_END = 4; }
  Kind kind = 1;
  TaskInfo task = 2;
}
