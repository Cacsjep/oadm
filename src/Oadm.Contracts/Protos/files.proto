syntax = "proto3";
package oadm.v1;
option csharp_namespace = "Oadm.Contracts.V1";
import "Protos/common.proto";

// Uploads from client dialogs (firmware images, ACAP packages). The server keeps them in
// <datafolder>/uploads for Uploads.RetentionHours (default 24) and enforces Uploads.MaxMegabytes
// (default 2048). Tasks reference an upload by id in their payload.
service FileService {
  // First message: header, then data chunks (256 KB). Errors: INVALID_ARGUMENT (no header, empty
  // name, size mismatch), RESOURCE_EXHAUSTED (over the size limit).
  rpc Upload (stream UploadChunk) returns (UploadedFileInfo);
  rpc Delete (FileIdRequest) returns (Empty);
}

message UploadHeader {
  string name = 1;   // file name only, no path
  int64 size = 2;    // exact size in bytes
}

message UploadChunk {
  oneof part {
    UploadHeader header = 1;
    bytes data = 2;
  }
}

message UploadedFileInfo {
  string id = 1;
  string name = 2;
  int64 size = 3;
  string sha256 = 4;   // upper-case hex
}

message FileIdRequest { string file_id = 1; }
