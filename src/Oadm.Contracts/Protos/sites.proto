syntax = "proto3";
package oadm.v1;
option csharp_namespace = "Oadm.Contracts.V1";
import "Protos/common.proto";
import "google/protobuf/timestamp.proto";

// Sites: remote networks the server reaches through an OADM Site Node (docs/sites.md). The Sites page lists the bound
// sites and the nodes waiting to be bound. Reading needs "See sites" (sites.view); everything that changes a site is
// Administrator only.
service SiteService {
  rpc ListSites (Empty) returns (SiteList);
  // The list on subscribe and after every change (state, counts, round trip), at most every second.
  rpc WatchSites (Empty) returns (stream SiteList);
  // Administrator: turns the site listener on or off (setting Sites.Accept) without a restart. Off closes every node
  // connection (inbound sites stay reachable).
  rpc SetAccept (SetAcceptRequest) returns (SiteList);
  // Administrator: nodes that wait for the server (inbound), by mDNS for `duration_seconds` or at one address.
  rpc FindNodes (FindNodesRequest) returns (stream FoundNode);
  // Administrator. INVALID_ARGUMENT for a bad name or a wrong pairing code ("The pairing code is wrong."), ALREADY_EXISTS
  // for a node id or key the server knows ("This site node is a copy of X. Click Reset on the copy."),
  // FAILED_PRECONDITION while binding is closed on the node, RESOURCE_EXHAUSTED over 100 sites or after 5 wrong codes.
  rpc BindSite (BindSiteRequest) returns (Site);
  rpc RenameSite (RenameSiteRequest) returns (Site);
  // Inbound sites only: another address of the same node (checked by its key).
  rpc ChangeSiteAddress (ChangeSiteAddressRequest) returns (Site);
  // Moves every device of a site to another bound site after checking each one there. Reply: the devices that stayed.
  rpc ReplaceSite (ReplaceSiteRequest) returns (ReplaceSiteReply);
  rpc RemoveSite (RemoveSiteRequest) returns (RemoveSiteReply);
}

enum SiteState {
  SITE_STATE_UNSPECIFIED = 0;
  SITE_STATE_ONLINE = 1;
  SITE_STATE_OFFLINE = 2;
  SITE_STATE_NOT_BOUND = 3;        // the node was reset or forgot the server
  SITE_STATE_WAITING = 4;          // a node that connected or was found and waits to be bound (not a site yet)
  SITE_STATE_BOUND_ELSEWHERE = 5;  // found node bound to another server (greyed)
  SITE_STATE_BINDING_CLOSED = 6;   // found node with binding closed (greyed)
}

enum SiteMode {
  SITE_MODE_UNSPECIFIED = 0;
  SITE_MODE_OUTBOUND = 1;          // the node connects to the server (default)
  SITE_MODE_INBOUND = 2;           // the server connects to the node
}

message Site {
  string id = 1;                   // Guid; for a waiting node empty (use node_id)
  string name = 2;
  SiteState state = 3;
  SiteMode mode = 4;
  string node_id = 5;
  string node_address = 6;         // inbound: where the server connects; outbound: last seen from
  int32 node_port = 7;
  string version = 8;
  bool update_available = 9;
  int32 device_count = 10;
  int32 round_trip_ms = 11;        // 0 = not measured
  int32 short_connections = 12;
  int32 permanent_connections = 13;
  int32 ports_waiting = 14;        // ports asked for and not allowed in the node app yet
  int32 large_transfers = 15;
  google.protobuf.Timestamp last_seen = 16;
  google.protobuf.Timestamp bound = 17;
  string message = 18;             // plain text of the state ("Site node too old. Update it.")
  string node_fingerprint = 19;    // hex SHA-256 of the node's key
}

message SiteList {
  repeated Site sites = 1;         // bound sites by name, then waiting nodes
  bool accept = 2;                 // Accept site nodes
  string listen_address = 3;       // what to type in the node app ("10.0.0.5:5081")
}

message SetAcceptRequest { bool accept = 1; }

message FindNodesRequest {
  int32 duration_seconds = 1;      // mDNS search; ignored with an address
  string address = 2;              // Add manually: host or IP, optional port
}

message FoundNode { Site node = 1; bool finished = 2; }

message BindSiteRequest {
  string node_id = 1;
  string name = 2;
  string pairing_code = 3;         // 8 characters, Crockford base32; case and dashes ignored
}

message RenameSiteRequest { string id = 1; string name = 2; }

message ChangeSiteAddressRequest { string id = 1; string address = 2; int32 port = 3; }

message ReplaceSiteRequest { string id = 1; string new_site_id = 2; }

message ReplaceSiteReply {
  int32 moved = 1;
  repeated string stayed_device_ids = 2;   // did not answer through the new site
}

message RemoveSiteRequest {
  string id = 1;
  bool keep_devices = 2;           // keep them as Site offline; else removed with credentials and tags
}

message RemoveSiteReply {
  bool node_answered = 1;          // false: "The site node did not answer. Reset it in the OADM Site Node app."
  int32 devices_removed = 2;
}
