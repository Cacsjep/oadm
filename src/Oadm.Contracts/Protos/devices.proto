syntax = "proto3";
package oadm.v1;
option csharp_namespace = "Oadm.Contracts.V1";
import "Protos/common.proto";

service DeviceService {
  // One message with every device. With 5,000 devices and their API lists this message is tens of MB:
  // clients use Watch with snapshot_end_marker instead (streamed, one message per device).
  rpc List (Empty) returns (DeviceList);
  // Starts with a snapshot, one ADDED per device; with snapshot_end_marker a SNAPSHOT_END follows it.
  // WatchDevicesRequest is wire compatible with the former Empty request (no fields = old behavior).
  rpc Watch (WatchDevicesRequest) returns (stream DeviceChanged);
  rpc Remove (DeviceIds) returns (Empty);              // one transaction for all ids
  rpc Refresh (DeviceIds) returns (Empty);
  rpc SetCredentials (SetCredentialsRequest) returns (Empty);   // one transaction for all ids
  rpc GetWebUiUrl (DeviceId) returns (UrlReply);
  // "Log in" for managed devices whose stored credentials are rejected: tries one credential on every device
  // (bounded parallelism), stores it for those that accept it and queues their refresh. One call for the selection.
  rpc LogIn (DeviceLogInRequest) returns (DeviceLogInReply);
  // The user name OADM stores for these devices when they all share one (prefill of the Log in dialog); empty otherwise.
  rpc GetCredentialUserName (DeviceIds) returns (CredentialUserNameReply);
  // "Set password" for managed devices in factory default (status Password not set): the first root password over
  // pwdgrp.cgi like the add page (HTTPS when offered, POST body only), only on devices that report needsetup=yes right
  // before; stored as their credential and their refresh queued. One call for the selection.
  rpc SetFirstPassword (SetFirstPasswordRequest) returns (SetFirstPasswordReply);
  // The passphrase policy (systemready: none, length, complex) of each device, for the hint of the Set password dialog.
  rpc GetPassphrasePolicies (DeviceIds) returns (PassphrasePoliciesReply);
  // "Trust new certificate" for devices with status Certificate changed: the certificate each one presents now (the TLS
  // handshake with the old pin only; nothing is sent to the device).
  rpc GetPresentedCertificates (DeviceIds) returns (PresentedCertificatesReply);
  // Pins the fingerprint the user confirmed for each device (checked again: pinned to it, serial with the stored
  // credentials), keeps the record and queues its refresh. One call for the selection.
  rpc TrustNewCertificates (TrustNewCertificatesRequest) returns (TrustNewCertificatesReply);
  // The devices of the caller's view that match a filter, one page in a fixed order after the last row of the page before
  // (its sort key and id), with the number of matches and, when asked, the counts of a field. Only the page is mapped:
  // the MCP device tools (docs/spec/mcp.md) use it instead of List.
  rpc Search (SearchDevicesRequest) returns (SearchDevicesReply);
  // Every device of the caller's view that matches a filter, as the ids in address order (the fixed list of a preview), and the
  // first `shown` of them as rows. Unknown ids and ids outside the view refuse the request (NOT_FOUND), like Search.
  rpc Resolve (ResolveDevicesRequest) returns (ResolveDevicesReply);
  // Stores one entry of the credential list as the login of the devices, without the password ever leaving the server:
  // the entry is chosen by its id. Only users with all devices (the credential list is never used for a device group).
  // NOT_FOUND for an unknown entry or device, INVALID_ARGUMENT for no devices.
  rpc SetStoredCredentials (SetStoredCredentialsRequest) returns (Empty);
}

// Which devices: every field optional, the fields combined with AND, a list matches any of its values; empty = every device
// of the view.
message DeviceFilter {
  repeated string ids = 1;
  string search = 2;                 // in the address, host name, UPnP name, serial, model, AXIS OS version, site or tags (any case)
  repeated string tags = 3;          // tag names (any case)
  repeated string sites = 4;         // site names (any case); "This server" for the server's own network
  repeated string models = 5;        // any case
  string firmware_below = 6;         // only an AXIS OS older than this, e.g. "12.11"
  string firmware_at_least = 7;      // only this AXIS OS or newer
  repeated DeviceStatus statuses = 8;
  repeated DeviceCategory categories = 9;
  // What OADM knows from polling (docs/spec/mcp.md "Devices and the device filter"); nothing is asked of the devices.
  repeated string clock = 10;               // "ok", "off" (the Clock column's warning), "not_measured"
  int32 clock_offset_over_seconds = 11;     // only a measured clock more than this many seconds off either way; 0: none
  repeated NtpState ntp_states = 12;
  optional int32 certificate_expires_within_days = 13; // only an HTTPS certificate that ends within this many days (or ended)
  repeated CertificateTrust certificate_trust = 14;
  repeated string socs = 15;                // chips, compared short ("A8" and "Axis Artpec-8" are the same)
  // The Axis CVEs of the device's AXIS OS (docs/spec/vulnerabilities.md): "affected" (at least one counted CVE),
  // "possible" (only possible ones), "any" (counted or possible), "none".
  string vulnerabilities = 16;
  string vulnerability_min_severity = 17;   // only a counted CVE of this level or worse: "Low", "Medium", "High", "Critical"
  string cve = 18;                          // only devices this CVE id may affect (counted or possible)
}

message SearchDevicesRequest {
  DeviceFilter filter = 1;
  // "address" (default; IPv4 in number order), "host_name", "upnp_name", "model", "firmware", "status", "last_seen";
  // a leading "-" sorts descending. Ties in id order.
  string sort = 2;
  string after_key = 3;     // the sort key of the last row of the page before (SearchDevicesReply.sort_keys)
  string after_id = 4;      // its id; both empty for the first page
  int32 limit = 5;          // rows, 0 to 500 (0: only the total and the counts)
  bool with_apis = 6;       // the API lists of the rows (one device's details); without them the rows have none
  // counts by "status", "model", "firmware", "site", "tag", "category", "soc", "clock", "ntp", "certificate",
  // "vulnerabilities" (the worst counted level, "Possible only", "None") or "cve" (devices per CVE id, counted ones);
  // empty: no counts
  string group_by = 7;
  bool with_health = 8;     // the counts of DeviceHealth for the matches
}

// What needs a look among the matches of a search (the summary of the MCP device tools): counts only.
message DeviceHealth {
  int32 not_ok = 1;                       // status other than Ok
  int32 clock_off = 2;                    // the Clock column's warning (beyond the allowed difference or NTP not synced)
  int32 clock_not_measured = 3;
  int32 certificates_expired = 4;
  int32 certificates_expiring_soon = 5;   // within the device's days of PKI's Expiry warning policy (30 without one)
  int32 certificates_not_trusted = 6;     // self-signed, untrusted or expired
  int32 vulnerable = 7;                   // at least one counted CVE
  int32 vulnerable_critical_or_high = 8;  // the worst counted CVE is Critical or High
  int32 possibly_vulnerable_only = 9;     // only possible CVEs (not counted)
}

message DeviceFieldCount {
  string value = 1;
  int32 count = 2;
}

message SearchDevicesReply {
  int32 total = 1;                      // every device that matches
  repeated Device devices = 2;          // the page
  repeated string sort_keys = 3;        // the sort key of each row of the page
  repeated DeviceFieldCount counts = 4; // with group_by: every value, the most devices first
  int32 after_cursor = 5;               // the matches after the cursor (the page and the rest); total without a cursor
  DeviceHealth health = 6;              // with with_health
}

message ResolveDevicesRequest {
  DeviceFilter filter = 1;
  int32 shown = 2;                      // rows of `first`, 0 to 100
}

message ResolveDevicesReply {
  repeated string ids = 1;              // every match, in address order (without the API lists)
  repeated Device first = 2;            // the first `shown` matches
}

message SetStoredCredentialsRequest {
  repeated string device_ids = 1;
  string credential_id = 2;             // an entry of SettingsService.ListCredentials
}

message DeviceId { string id = 1; }
message DeviceIds { repeated string ids = 1; }
message DeviceList { repeated Device devices = 1; }
message UrlReply { string url = 1; }

message WatchDevicesRequest {
  // Send one DeviceChanged with kind SNAPSHOT_END (and no device) after the snapshot, so the client can
  // replace its mirror in one step and remove devices that are gone.
  bool snapshot_end_marker = 1;
}

message SetCredentialsRequest {
  repeated string device_ids = 1;
  string user_name = 2;
  string password = 3;
}

message DeviceChanged {
  // SNAPSHOT_END only when WatchDevicesRequest.snapshot_end_marker is set.
  enum Kind { KIND_UNSPECIFIED = 0; ADDED = 1; UPDATED = 2; REMOVED = 3; SNAPSHOT_END = 4; }
  Kind kind = 1;
  Device device = 2;   // for REMOVED only id is set; unset for SNAPSHOT_END
}

message DeviceLogInRequest {
  repeated string device_ids = 1;
  string user_name = 2;
  string password = 3;
  // Also add the credential to the credential list (administrators only; ignored for operators).
  bool save_to_credential_list = 4;
}

message DeviceLogInResult {
  string device_id = 1;
  bool ok = 2;
  // The device answered and rejected the user name or password (401/403).
  bool rejected = 3;
  // User facing reason when not ok: "The user name or password is wrong.", "Unreachable - ...".
  string message = 4;
}

message DeviceLogInReply {
  repeated DeviceLogInResult results = 1;   // one per requested device, in request order
  // Set when save_to_credential_list was asked but the credential could not be saved there
  // ("The credential list is full (20 entries); the login was not saved there."). Never fails the login.
  string credential_list_note = 2;
}

message CredentialUserNameReply { string user_name = 1; }

message SetFirstPasswordRequest {
  repeated string device_ids = 1;
  string password = 2;   // 1-64 printable ASCII; user is always root
  // An entry of the credential list (user root) instead of password: the server reads its stored password, which never
  // reaches the client. Administrator only (the credential list's rule); NOT_FOUND unknown entry, INVALID_ARGUMENT another
  // user than root, a password that does not fit a first password, or both password and credential_id.
  string credential_id = 3;
}

message SetFirstPasswordResult {
  string device_id = 1;
  bool ok = 2;
  // User facing reason when not ok: "The device already has a password. Nothing was changed.", "The device rejected
  // the password: ...", "Unreachable - ...".
  string message = 3;
}

message SetFirstPasswordReply {
  repeated SetFirstPasswordResult results = 1;   // one per requested device, in request order
}

message DevicePassphrasePolicy {
  string device_id = 1;
  string policy = 2;   // "none", "length", "complex"; empty when it could not be read
}

message PassphrasePoliciesReply {
  repeated DevicePassphrasePolicy policies = 1;
}

message PresentedCertificate {
  string device_id = 1;
  string pinned_fingerprint = 2;   // SHA-256, upper hex: the certificate OADM trusts
  string fingerprint = 3;          // SHA-256, upper hex of the presented one; empty when message is set
  string subject = 4;
  string issuer = 5;
  int64 not_before_unix_ms = 6;
  int64 not_after_unix_ms = 7;
  CertificateTrust trust = 8;   // like Device.cert_trust
  // User facing reason when there is nothing to trust: "The device does not show Certificate changed. Nothing was
  // changed.", "The device presents the trusted certificate again.", "Unreachable - ...".
  string message = 9;
}

message PresentedCertificatesReply {
  repeated PresentedCertificate certificates = 1;   // one per requested device, in request order
}

message TrustNewCertificate {
  string device_id = 1;
  string fingerprint = 2;   // the presented fingerprint the user saw and confirmed
}

message TrustNewCertificatesRequest {
  repeated TrustNewCertificate devices = 1;
}

message TrustNewCertificateResult {
  string device_id = 1;
  bool ok = 2;
  // User facing reason when not ok: "The device now presents another certificate than shown. Nothing was changed.", ...
  string message = 3;
}

message TrustNewCertificatesReply {
  repeated TrustNewCertificateResult results = 1;   // one per requested device, in request order
}
