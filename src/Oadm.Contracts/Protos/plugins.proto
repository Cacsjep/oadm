syntax = "proto3";
package oadm.v1;
option csharp_namespace = "Oadm.Contracts.V1";
import "Protos/common.proto";

service PluginService {
  rpc ListCorePlugins (Empty) returns (CorePluginList);
  rpc Invoke (InvokeRequest) returns (InvokeReply);
  // Live events a core plugin pushes to its page (ICorePluginContext.Events), from the moment of the call until
  // the client cancels. NOT_FOUND for an unknown plugin. A slow watcher loses the oldest events (256 buffered).
  rpc Watch (WatchPluginRequest) returns (stream PluginEvent);
  // A file of a core plugin (ICorePluginDownloads), e.g. a recording export passed on from a device: the first message
  // carries file_name and length (-1 unknown), every message data (256 KB at most), uncompressed. The permission and the
  // errors are those of Invoke; UNIMPLEMENTED for a plugin without downloads.
  rpc Download (InvokeRequest) returns (stream DownloadChunk);
  // Every loaded plugin package (plugin folder) with its state; the Settings page's plugin list. Any logged-in user.
  rpc ListPackages (Empty) returns (PluginPackageList);
  // Admin: turns a package (its core plugins and tasks together) on or off at once, stored on the server.
  // NOT_FOUND for an unknown package. Reply: the whole list.
  rpc SetPackageEnabled (SetPackageEnabledRequest) returns (PluginPackageList);
  // Admin: checks and stores the license of a commercial plugin (plugin.json "license"); it applies at once.
  // NOT_FOUND unknown package, FAILED_PRECONDITION a package that needs no license, INVALID_ARGUMENT a license that is not
  // valid, for another server or expired (the reason as detail; nothing stored). Reply: the whole list.
  rpc SetPackageLicense (SetPackageLicenseRequest) returns (PluginPackageList);
  // Admin: removes the license of a package (the plugin falls back to its trial or to no license). Reply: the whole list.
  rpc RemovePackageLicense (PackageIdRequest) returns (PluginPackageList);
  // Add-on plugins (docs/spec/add-ons.md): plugins of this OADM version that are not in its installers. Any logged-in user:
  // the add-ons of this version (AddOnCatalog) with their state on this server.
  rpc ListAddOns (ListAddOnsRequest) returns (AddOnList);
  // Admin: takes back an add-on that was removed and is still loaded; nothing to send. The stream of AddOnProgress ends with
  // done or error. A file is installed with UploadAddOn. NOT_FOUND unknown add-on, FAILED_PRECONDITION any other state,
  // another install or remove running, or a self update running.
  rpc InstallAddOn (AddOnIdRequest) returns (stream AddOnProgress);
  // Admin: installs an add-on from a ZIP the user chose. First message: header, then data chunks (256 KB). The server
  // checks the file against the SHA-256 built into this server, unpacks it and loads it (off). Streams the progress; the
  // last message has done or error set (a failure leaves the state as it was). INVALID_ARGUMENT no header, NOT_FOUND
  // unknown add-on, FAILED_PRECONDITION already installed, removed and still loaded, a build without the add-on's hash,
  // another install or remove running, or a self update running.
  rpc UploadAddOn (stream AddOnUploadChunk) returns (stream AddOnProgress);
  // Admin: turns the add-on off at once; its folder goes at the next server start. NOT_FOUND unknown add-on,
  // FAILED_PRECONDITION not installed or a self update running. Reply: the whole list.
  rpc RemoveAddOn (AddOnIdRequest) returns (AddOnList);
  // Any logged-in user: the client part of an installed add-on, every file with its SHA-256 (the client checks each).
  // NOT_FOUND unknown or not installed add-on, FAILED_PRECONDITION while the same session waits for one already.
  rpc GetAddOnClientPart (AddOnIdRequest) returns (AddOnClientPart);
}

// no_page: the plugin has no rail page (ICorePlugin.HasPage false), e.g. a toolbar-only plugin; clients add no rail entry.
message CorePluginInfo { string id = 1; string display_name = 2; string icon_key = 3; bool no_page = 4; string group = 5; } // group: CorePluginGroup name
message CorePluginList { repeated CorePluginInfo plugins = 1; }
message InvokeRequest { string plugin_id = 1; string method = 2; string payload_json = 3; }
message InvokeReply { string payload_json = 1; }
message WatchPluginRequest { string plugin_id = 1; }
message DownloadChunk { string file_name = 1; int64 length = 2; bytes data = 3; }
message PluginEvent { string plugin_id = 1; string topic = 2; string payload_json = 3; }

// id = plugin.json id; has_page: a rail page; menu_task_count: context menu entries; always_on: core functionality that
// cannot be turned off (SetPackageEnabled answers FAILED_PRECONDITION); description: one sentence from plugin.json.
message PluginPackageInfo {
  string id = 1;
  string display_name = 2;
  string version = 3;
  bool enabled = 4;
  bool enabled_by_default = 5;
  bool has_page = 6;
  int32 menu_task_count = 7;
  bool always_on = 8;
  string description = 9;
  string group = 10;   // rail group of its core plugin ("Servers", "Monitoring"); "Extensions" without one
  PluginLicenseState license = 11;   // unset or status NOT_REQUIRED: a free plugin
  string site_support = 12;          // "full", "none" (plugin.json siteSupport; a manifest without it is "none"); empty from older servers
  repeated PluginSitePort site_ports = 13;   // plugin.json sitePorts: the ports it listens on at sites
  bool pro = 14;                     // plugin.json pro: an OADM PRO plugin, on only while OADM PRO is active
}

// A port a plugin listens on at sites (relays), as plugin.json declares it.
message PluginSitePort {
  string protocol = 1;   // "udp", "tcp"
  int32 port = 2;
  string reason = 3;     // "NTP server"
}

// The license of a commercial plugin as the server checked it (Oadm.Sdk.Licensing.PluginLicenseInfo).
enum PluginLicenseStatus {
  PLUGIN_LICENSE_NOT_REQUIRED = 0;
  PLUGIN_LICENSE_VALID = 1;
  PLUGIN_LICENSE_TRIAL = 2;
  PLUGIN_LICENSE_TRIAL_ENDED = 3;
  PLUGIN_LICENSE_MISSING = 4;
  PLUGIN_LICENSE_EXPIRED = 5;
  PLUGIN_LICENSE_WRONG_SERVER = 6;
  PLUGIN_LICENSE_INVALID = 7;
}
// reason: one plain sentence; customer, issued, expires ("yyyy-MM-dd", empty = never), features and limits from a
// readable license; trial_ends while there is a trial; available_features from plugin.json.
message PluginLicenseState {
  PluginLicenseStatus status = 1;
  string reason = 2;
  string customer = 3;
  string issued = 4;
  string expires = 5;
  repeated string features = 6;
  map<string, int64> limits = 7;
  string trial_ends = 8;
  repeated string available_features = 9;
}
// server_id: this server's ID, which licenses name (Plugins page, copy button); pro_active: OADM PRO is active, so PRO
// plugins can be turned on (SetPackageEnabled answers FAILED_PRECONDITION otherwise).
message PluginPackageList { repeated PluginPackageInfo packages = 1; string server_id = 2; bool pro_active = 3; }
message SetPackageLicenseRequest { string id = 1; string license = 2; }
message PackageIdRequest { string id = 1; }
message SetPackageEnabledRequest { string id = 1; bool enabled = 2; }
message ListAddOnsRequest { reserved 1; } // check_reach
// The state of an add-on on this server (Oadm.Server.AddOns.AddOnState).
enum AddOnState {
  ADD_ON_NOT_INSTALLED = 0;
  ADD_ON_INSTALLING = 1;
  ADD_ON_INSTALLED = 2;
  ADD_ON_REMOVED = 3;      // turned off, its files go at the next server start
  ADD_ON_FAILED = 4;       // installed before, not loaded now: another version after an update, no files after a restore (message says so)
}
// One add-on of this OADM version: id = plugin.json id; description: one line what it adds; percent while installing;
// message: why it is not loaded or cannot be installed, empty otherwise; can_install: whether Install works now;
// client_digest: the digest of its client part (AddOnClientPart.digest) while installed, empty otherwise; download_url:
// the ZIP of this server's version and system on the OADM release, empty for a build that cannot install it.
message AddOnInfo {
  reserved 4; // size_bytes
  string id = 1;
  string display_name = 2;
  string description = 3;
  AddOnState state = 5;
  int32 percent = 6;
  string message = 7;
  string version = 8;
  bool can_install = 9;
  string client_digest = 10;
  string download_url = 11;
}
message AddOnList { repeated AddOnInfo add_ons = 1; }
message AddOnIdRequest { string id = 1; }
enum AddOnStep {
  ADD_ON_STEP_UPLOAD = 0;
  ADD_ON_STEP_CHECK = 1;
  ADD_ON_STEP_INSTALL = 2;
}
// file_name: the chosen file, name only; size: its exact size in bytes.
message AddOnUploadHeader { string id = 1; string file_name = 2; int64 size = 3; }
message AddOnUploadChunk {
  oneof part {
    AddOnUploadHeader header = 1;
    bytes data = 2;
  }
}
// Progress of InstallAddOn and UploadAddOn: the step and its percent (0 to 100); the last message has done (installed) or
// error (one plain sentence, nothing installed) set.
message AddOnProgress {
  AddOnStep step = 1;
  int32 percent = 2;
  bool done = 3;
  string error = 4;
}
// A file of an add-on's client part: path relative to the add-on folder ("/" separated), its bytes and SHA-256
// (lowercase hex).
message AddOnFile { string path = 1; bytes data = 2; string sha256 = 3; }
// The client part of an add-on for the server's version (the client keeps it per server and version). digest: SHA-256
// (lowercase hex) over one "<path> <sha256>\n" line per file sorted by path (Oadm.Contracts.AddOnLayout.Digest); the
// client checks its cached copy against it.
message AddOnClientPart { string id = 1; string version = 2; repeated AddOnFile files = 3; string digest = 4; }
