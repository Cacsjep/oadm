syntax = "proto3";
package oadm.v1;
option csharp_namespace = "Oadm.Contracts.V1";
import "Protos/common.proto";

service PluginService {
  rpc ListCorePlugins (Empty) returns (CorePluginList);
  rpc Invoke (InvokeRequest) returns (InvokeReply);
  // Live events a core plugin pushes to its page (ICorePluginContext.Events), from the moment of the call until
  // the client cancels. NOT_FOUND for an unknown plugin. A slow watcher loses the oldest events (256 buffered).
  rpc Watch (WatchPluginRequest) returns (stream PluginEvent);
  // A file of a core plugin (ICorePluginDownloads), e.g. a recording export passed on from a device: the first message
  // carries file_name and length (-1 unknown), every message data (256 KB at most), uncompressed. The permission and the
  // errors are those of Invoke; UNIMPLEMENTED for a plugin without downloads.
  rpc Download (InvokeRequest) returns (stream DownloadChunk);
  // Every loaded plugin package (plugin folder) with its state; the Settings page's plugin list. Any logged-in user.
  rpc ListPackages (Empty) returns (PluginPackageList);
  // Admin: turns a package (its core plugins and tasks together) on or off at once, stored on the server.
  // NOT_FOUND for an unknown package. Reply: the whole list.
  rpc SetPackageEnabled (SetPackageEnabledRequest) returns (PluginPackageList);
}

// no_page: the plugin has no rail page (ICorePlugin.HasPage false), e.g. a toolbar-only plugin; clients add no rail entry.
message CorePluginInfo { string id = 1; string display_name = 2; string icon_key = 3; bool no_page = 4; string group = 5; } // group: CorePluginGroup name
message CorePluginList { repeated CorePluginInfo plugins = 1; }
message InvokeRequest { string plugin_id = 1; string method = 2; string payload_json = 3; }
message InvokeReply { string payload_json = 1; }
message WatchPluginRequest { string plugin_id = 1; }
message DownloadChunk { string file_name = 1; int64 length = 2; bytes data = 3; }
message PluginEvent { string plugin_id = 1; string topic = 2; string payload_json = 3; }

// id = plugin.json id; has_page: a rail page; menu_task_count: context menu entries; always_on: core functionality that
// cannot be turned off (SetPackageEnabled answers FAILED_PRECONDITION); description: one sentence from plugin.json.
message PluginPackageInfo {
  string id = 1;
  string display_name = 2;
  string version = 3;
  bool enabled = 4;
  bool enabled_by_default = 5;
  bool has_page = 6;
  int32 menu_task_count = 7;
  bool always_on = 8;
  string description = 9;
  string group = 10;   // rail group of its core plugin ("Servers", "Monitoring"); "Extensions" without one
}
message PluginPackageList { repeated PluginPackageInfo packages = 1; }
message SetPackageEnabledRequest { string id = 1; bool enabled = 2; }
