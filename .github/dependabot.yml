# Weekly pull requests for updates: the commit-pinned GitHub Actions (new hash and version comment) and the NuGet
# packages, grouped so related packages move together. Security updates come at once, outside the schedule.
# Every pull request is built and unit-tested by pr.yml before it is merged.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Newer majors changed their license away from open source (OSMF EULA): stay on the last open one.
    ignore:
      - dependency-name: "JsonSchema.Net"
        versions: [">= 9.0.0"]
      - dependency-name: "WixToolset.*"
        versions: [">= 7.0.0"]
      # 6.5 refuses to create a PDF without a license it loads ("The loaded license is not valid"): stay on 6.2.
      - dependency-name: "PDFsharp-MigraDoc"
        versions: [">= 6.3.0"]
    groups:
      avalonia:
        patterns: ["Avalonia*", "AvaloniaUI.*"]
      grpc:
        patterns: ["Grpc.*", "Google.Protobuf"]
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
      serilog:
        patterns: ["Serilog*"]
      tests:
        patterns: ["xunit*", "NSubstitute", "coverlet.*"]

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    groups:
      website:
        patterns: ["*"]
