# Weekly pull requests for updates: the commit-pinned GitHub Actions (new hash and version comment) and the NuGet
# packages, grouped so related packages move together. Security updates come at once, outside the schedule.
# Every pull request is built and unit-tested by pr.yml before it is merged.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      avalonia:
        patterns: ["Avalonia*", "AvaloniaUI.*"]
      grpc:
        patterns: ["Grpc.*", "Google.Protobuf"]
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
      serilog:
        patterns: ["Serilog*"]
      tests:
        patterns: ["xunit*", "NSubstitute", "coverlet.*"]
