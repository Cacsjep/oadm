name: release

# The one CI workflow (replaces ci.yml and package.yml). Runs only for release tags (v0.0.1, v1.2.0, ...):
#   1. tests      build and unit tests on Windows, Linux and macOS (like "manage test unit", one run; hang
#                 detection 5 min)
#   2. installers MSI (Windows), .deb packages (Linux amd64 and arm64), .pkg (macOS Intel), built with "manage package"; the MSI
#                 and the .deb packages are installed, checked and removed again, both as "Server and client" and as
#                 "Client only" (the MSI in the job smoke-windows); the .pkg is checked without installing it
#                 plus the portable ZIPs of the server and client publish folders per platform (plugin development);
#                 the OADM Site Node too: its MSI (installed by smoke-windows) and its .deb packages (amd64, arm64,
#                 installed, checked and removed here); no portable ZIP and no macOS package for the node
#   3. release    the GitHub release of the tag with the installers, the ZIPs and SHA256SUMS.txt (a tag with a pre-release
#                 part, v1.2.0-rc.1, is a pre-release and never the latest; installers are not signed;
#                 the checksums are published instead)
#   nuget-pack    (with the installers) the plugin SDK packages, every template built and tested with them
#   4. nuget      the plugin SDK packages on nuget.org (Trusted Publishing), after the release; skipped without the
#                 repository variable NUGET_USER and for a pre-release tag (v1.2.0-rc.1)
# A job starts only when the jobs before it passed, so a release exists only when everything passed.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: tests ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet build Oadm.sln -c Release
      # Unit tests only (like manage test unit): Perf tests have time budgets made for a developer machine and run with
      # manage test perf; hardware tests need real devices. One run, no retry: the tests wait for conditions, not for
      # time, so a failure is a real one (CLAUDE.md "Tests that never flake").
      # A crashed test host leaves a dump and the tests it ran (--blame-crash), uploaded when the step fails.
      - run: dotnet test Oadm.sln -c Release --no-build --filter "Category!=Hardware&Category!=Perf&Category!=HardwareWrite" --blame-hang-timeout 5m --blame-crash --blame-crash-dump-type mini
      - name: Upload crash dumps and test sequences
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: tests/**/TestResults/**
          if-no-files-found: ignore
          retention-days: 14

  installers:
    name: installer ${{ matrix.target }} ${{ matrix.rid }}
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        # x64, plus Linux arm64 (Raspberry Pi, ARM servers) built and installed on a native ARM runner. macOS: the .pkg
        # is checked without installing it.
        include:
          - { os: windows-latest, target: windows, rid: win-x64, smoke: false } # installed by the job smoke-windows
          - { os: ubuntu-latest, target: linux, rid: linux-x64, deb: amd64, smoke: true }
          - { os: ubuntu-24.04-arm, target: linux, rid: linux-arm64, deb: arm64, smoke: true }
          - { os: macos-latest, target: macos, rid: osx-x64, smoke: false }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Version
        id: version
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "OADM version $v"

      - name: Build package (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: ./manage.ps1 package windows --rid ${{ matrix.rid }} --version ${{ steps.version.outputs.version }}

      - name: Build package (Linux, macOS)
        if: matrix.target != 'windows'
        shell: bash
        run: ./manage.sh package ${{ matrix.target }} --rid ${{ matrix.rid }} --version ${{ steps.version.outputs.version }}

      # The OADM Site Node (docs/spec/sites.md, "Packaging"): the MSI on Windows, both .deb packages on each Linux runner.
      - name: Build site node package (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: ./manage.ps1 package site-node --rid ${{ matrix.rid }} --version ${{ steps.version.outputs.version }}

      - name: Build site node packages (Linux)
        if: matrix.target == 'linux'
        shell: bash
        run: ./manage.sh package site-node --rid ${{ matrix.rid }} --version ${{ steps.version.outputs.version }}

      - name: License texts next to the published exes
        shell: bash
        run: |
          for app in server client; do
            for f in TERMS.md LICENSE.txt NOTICE.txt THIRD-PARTY-NOTICES.txt LGPL-2.1.txt; do
              test -s "artifacts/publish/$app/${{ matrix.rid }}/$f" || { echo "$app: $f missing"; exit 1; }
            done
          done
          grep -q "GNU LESSER GENERAL PUBLIC LICENSE" "artifacts/publish/client/${{ matrix.rid }}/THIRD-PARTY-NOTICES.txt"
          grep -q "^Avalonia " "artifacts/publish/client/${{ matrix.rid }}/THIRD-PARTY-NOTICES.txt"
          if [ "${{ matrix.target }}" != macos ]; then
            # The site node has no LGPL part: no LGPL-2.1.txt.
            for app in site-node site-node-app; do
              for f in TERMS.md LICENSE.txt NOTICE.txt THIRD-PARTY-NOTICES.txt; do
                test -s "artifacts/publish/$app/${{ matrix.rid }}/$f" || { echo "$app: $f missing"; exit 1; }
              done
              test ! -e "artifacts/publish/$app/${{ matrix.rid }}/LGPL-2.1.txt"
            done
            grep -q "^OADM Site Node third-party notices" "artifacts/publish/site-node/${{ matrix.rid }}/THIRD-PARTY-NOTICES.txt"
            grep -q "^Avalonia " "artifacts/publish/site-node-app/${{ matrix.rid }}/THIRD-PARTY-NOTICES.txt"
          fi

      # The publish folders as ZIPs (plugin development: "oadm dev" runs them without installing; website dev/plugin-sdk.md).
      # One top folder named like the file. zip keeps the executable bits on Linux and macOS.
      - name: Portable archives
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          rid="${{ matrix.rid }}"
          stage="artifacts/portable"
          out="artifacts/portable-zips"
          rm -rf "$stage" "$out" && mkdir -p "$stage" "$out"
          if [ "$RUNNER_OS" != "Windows" ] && ! command -v zip >/dev/null; then
            if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get install -y zip; else brew install zip; fi
          fi
          for app in Server Client; do
            name="OADM-$app-$version-$rid"
            cp -R "artifacts/publish/$(echo "$app" | tr '[:upper:]' '[:lower:]')/$rid" "$stage/$name"
            test -d "$stage/$name/plugins" || { echo "$name: plugins missing"; exit 1; }
            if [ "$RUNNER_OS" = "Windows" ]; then
              (cd "$stage" && pwsh -NoProfile -Command "Compress-Archive -Path '$name' -DestinationPath '$name.zip'")
            else
              (cd "$stage" && zip -qry "$name.zip" "$name")
            fi
            mv "$stage/$name.zip" "$out/"
            ls -l "$out/$name.zip"
          done

      - name: Validate MSI
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $msi = Get-ChildItem artifacts/packages/OADM-*.msi | Where-Object Name -notlike 'OADM-SiteNode-*' | Select-Object -First 1
          $wi = New-Object -ComObject WindowsInstaller.Installer
          $db = $wi.GetType().InvokeMember('OpenDatabase', 'InvokeMethod', $null, $wi, @($msi.FullName, 0))
          function Query([string]$q) {
            $view = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db, @($q))
            $view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null) | Out-Null
            while ($rec = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)) {
              $n = $rec.GetType().InvokeMember('FieldCount', 'GetProperty', $null, $rec, $null)
              (1..$n | ForEach-Object { $rec.GetType().InvokeMember('StringData', 'GetProperty', $null, $rec, @([int]$_)) }) -join ' | '
            }
          }
          $features = @(Query 'SELECT Feature FROM Feature') | Sort-Object
          "features: $($features -join ', ')"
          if (($features -join ',') -ne 'Client,Server') { throw 'features Client and Server expected' }
          Query 'SELECT Name, DisplayName, StartType, Arguments FROM ServiceInstall'
          $fw = @(Query 'SELECT Name, Port, Protocol, Profile FROM Wix5FirewallException' | Sort-Object)
          $fw
          # TCP 5081 (site nodes) is the server's own rule while Accept site nodes is on, never the installer's.
          if ($fw.Count -ne 1 -or $fw[0] -notmatch '^OADM Server \(gRPC, TCP 5080\) \| 5080 \| 6 \| \[OADM_FW_PROFILE\]$') { throw 'only the rule for TCP 5080 expected' }
          if ((Query "SELECT Value FROM Property WHERE Property='OADM_FW_PROFILE'") -ne '3') { throw 'firewall profile must be Domain + Private (3)' }
          $licenses = @(Query 'SELECT FileName FROM File') | Where-Object { $_ -match 'LICENSE\.txt|THIRD-PARTY-NOTICES\.txt|LGPL-2\.1\.txt' }
          if ($licenses.Count -ne 6) { throw "license texts in both folders expected, found $($licenses.Count)" }
          if (@(@(Query 'SELECT FileName FROM File') -match 'TERMS\.md').Count -ne 2) { throw 'TERMS.md in both folders expected' }
          Query "SELECT Property, Value FROM Property WHERE Property='ProductVersion'"

      - name: Validate site node MSI
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $msi = Get-ChildItem artifacts/packages/OADM-SiteNode-*-win-x64.msi | Select-Object -First 1
          if (-not $msi) { throw 'OADM-SiteNode-<version>-win-x64.msi missing' }
          $wi = New-Object -ComObject WindowsInstaller.Installer
          $db = $wi.GetType().InvokeMember('OpenDatabase', 'InvokeMethod', $null, $wi, @($msi.FullName, 0))
          function Query([string]$q) {
            $view = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db, @($q))
            $view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null) | Out-Null
            while ($rec = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)) {
              $n = $rec.GetType().InvokeMember('FieldCount', 'GetProperty', $null, $rec, $null)
              (1..$n | ForEach-Object { $rec.GetType().InvokeMember('StringData', 'GetProperty', $null, $rec, @([int]$_)) }) -join ' | '
            }
          }
          $service = @(Query 'SELECT Name, DisplayName, StartType, StartName FROM ServiceInstall')
          $service
          if ($service.Count -ne 1 -or $service[0] -ne 'OadmSiteNode | OADM Site Node | 2 | NT SERVICE\OadmSiteNode') { throw 'service OadmSiteNode as NT SERVICE\OadmSiteNode expected' }
          # No firewall rule: the node only connects out (it never listens).
          if (@(Query "SELECT Name FROM _Tables WHERE Name='Wix5FirewallException'").Count -ne 0) { throw 'the node MSI must not add a firewall rule' }
          $files = @(Query 'SELECT FileName FROM File')
          $files
          foreach ($f in 'oadm-site-node.exe', 'oadm-site-node-app.exe', 'THIRD-PARTY-NOTICES.txt', 'LICENSE.txt', 'NOTICE.txt', 'TERMS.md') {
            if (-not ($files -match [regex]::Escape($f))) { throw "$f missing" }
          }
          if ($files -match 'LGPL') { throw 'the node has no LGPL part' }
          Query "SELECT Action, Target FROM CustomAction WHERE Action='SetOadmSetServer'"
          Query "SELECT Property, Value FROM Property WHERE Property='ProductVersion'"

      - name: Inspect .deb packages
        if: matrix.target == 'linux'
        run: |
          ls -l artifacts/packages
          test -z "$(ls artifacts/packages/oadm_*.deb 2>/dev/null)" # no metapackage any more
          for p in oadm-server oadm-client; do
            deb=$(ls artifacts/packages/${p}_*_${{ matrix.deb }}.deb)
            dpkg-deb --info "$deb"
            dpkg-deb --contents "$deb" | grep -E 'Oadm.Server$|Oadm.Client$|oadm-server.service|plugins/[^/]+/$|/doc/' || true
          done
          dpkg-deb --field artifacts/packages/oadm-server_*_${{ matrix.deb }}.deb Breaks | grep -qx 'oadm'
          dpkg-deb --contents artifacts/packages/oadm-server_*_${{ matrix.deb }}.deb | grep -q 'usr/share/doc/oadm-server/THIRD-PARTY-NOTICES.txt'
          dpkg-deb --contents artifacts/packages/oadm-client_*_${{ matrix.deb }}.deb | grep -q 'usr/share/doc/oadm-client/LGPL-2.1.txt'
          for p in oadm-server oadm-client; do dpkg-deb --contents artifacts/packages/${p}_*_${{ matrix.deb }}.deb | grep -q "usr/share/doc/$p/TERMS.md"; done
          ! dpkg-deb --contents artifacts/packages/oadm-client_*_${{ matrix.deb }}.deb | grep -q 'oadm-server.service'
          # The site node: service + command line, and the app (Depends oadm-site-node); no LGPL text.
          node=$(ls artifacts/packages/oadm-site-node_*_${{ matrix.deb }}.deb)
          app=$(ls artifacts/packages/oadm-site-node-app_*_${{ matrix.deb }}.deb)
          dpkg-deb --info "$node"
          dpkg-deb --info "$app"
          dpkg-deb --contents "$node" | grep -q 'usr/lib/systemd/system/oadm-site-node.service'
          dpkg-deb --contents "$node" | grep -q 'usr/bin/oadm-site-node -> /opt/oadm/site-node/oadm-site-node'
          dpkg-deb --contents "$node" | grep -q 'usr/share/doc/oadm-site-node/THIRD-PARTY-NOTICES.txt'
          dpkg-deb --contents "$app" | grep -q 'usr/share/applications/oadm-site-node.desktop'
          dpkg-deb --contents "$app" | grep -q 'usr/share/doc/oadm-site-node-app/TERMS.md'
          ! dpkg-deb --contents "$node" | grep -q 'LGPL'
          ! dpkg-deb --contents "$app" | grep -q 'LGPL'
          dpkg-deb --field "$app" Depends | grep -q '^oadm-site-node (= '
          dpkg-deb --fsys-tarfile "$node" | tar -xO ./usr/lib/systemd/system/oadm-site-node.service > node.service
          grep -qx 'User=oadm-site-node' node.service
          grep -qx 'RuntimeDirectory=oadm-site-node' node.service
          grep -qx 'AmbientCapabilities=CAP_NET_BIND_SERVICE' node.service

      - name: Check .pkg choices (macOS, not installed)
        if: matrix.target == 'macos'
        run: |
          pkg=$(ls artifacts/packages/*.pkg)
          pkgutil --check-signature "$pkg" || true
          sudo installer -pkg "$pkg" -target / -showChoicesXML > choices.xml
          cat choices.xml
          grep -q com.oadm.choice.server choices.xml
          grep -q com.oadm.choice.client choices.xml
          pkgutil --expand-full "$pkg" expanded
          test -f expanded/oadm-client.pkg/Payload/OADM.app/Contents/Resources/THIRD-PARTY-NOTICES.txt
          test -f expanded/oadm-client.pkg/Payload/OADM.app/Contents/Resources/LGPL-2.1.txt
          test -f expanded/oadm-server.pkg/Payload/THIRD-PARTY-NOTICES.txt
          test -x expanded/oadm-client.pkg/Payload/OADM.app/Contents/Resources/uninstall-oadm.sh
          test -f expanded/oadm-client.pkg/Payload/OADM.app/Contents/Resources/TERMS.md
          # No license page: the client asks for the terms of use on its first start.
          ! grep -q '<license' expanded/Distribution

      - name: Smoke test (Linux .deb, server and client)
        if: matrix.target == 'linux' && matrix.smoke
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ./artifacts/packages/oadm-server_*_${{ matrix.deb }}.deb ./artifacts/packages/oadm-client_*_${{ matrix.deb }}.deb
          systemctl status oadm-server --no-pager || true
          for i in $(seq 60); do (exec 3<>/dev/tcp/127.0.0.1/5080) 2>/dev/null && break; sleep 1; done
          # gRPC over HTTP/2 with TLS (self-signed server certificate, pinned by clients; the check accepts it).
          headers=$(curl -sk --http2 -X POST -H 'content-type: application/grpc' -H 'te: trailers' -D - -o /dev/null https://127.0.0.1:5080/oadm.Smoke/Test)
          echo "$headers"
          echo "$headers" | grep -qi grpc-status
          systemctl is-active oadm-server
          sudo ls -la /var/lib/oadm
          test "$(sudo stat -c %a /var/lib/oadm/master.key)" = 600
          test "$(sudo stat -c %a /var/lib/oadm)" = 700
          test -L /usr/bin/oadm-client
          test -d /opt/oadm/server/plugins/oadm.restart && test -d /opt/oadm/client/plugins/oadm.restart
          test -s /opt/oadm/server/THIRD-PARTY-NOTICES.txt && test -s /usr/share/doc/oadm-client/THIRD-PARTY-NOTICES.txt
          ! sudo journalctl -u oadm-server --no-pager | grep -q 'could not be fixed'
          oadm-client --check-decoder
          sudo apt-get remove -y oadm-server oadm-client
          ! systemctl is-active oadm-server
          sudo test -f /var/lib/oadm/master.key
          echo "server and client: install, service, gRPC, remove ok"

      - name: Smoke test (Linux .deb, client only)
        if: matrix.target == 'linux' && matrix.smoke
        run: |
          sudo apt-get install -y ./artifacts/packages/oadm-client_*_${{ matrix.deb }}.deb
          ! systemctl cat oadm-server >/dev/null 2>&1
          test ! -e /opt/oadm/server/Oadm.Server
          oadm-client --check-decoder
          sudo apt-get remove -y oadm-client
          test ! -e /usr/bin/oadm-client
          echo "client only: install, decoder, remove ok"

      - name: Smoke test (Linux .deb, site node)
        if: matrix.target == 'linux' && matrix.smoke
        run: |
          sudo apt-get install -y ./artifacts/packages/oadm-site-node_*_${{ matrix.deb }}.deb ./artifacts/packages/oadm-site-node-app_*_${{ matrix.deb }}.deb
          systemctl status oadm-site-node --no-pager || true
          # The local channel answers every user; unbound right after the install.
          ok=0
          for i in $(seq 60); do if oadm-site-node status > status.txt 2>&1; then ok=1; break; fi; sleep 1; done
          cat status.txt
          test "$ok" = 1 || { sudo journalctl -u oadm-site-node --no-pager | tail -60; exit 1; }
          grep -q 'Not bound' status.txt
          systemctl is-active oadm-site-node
          # Its own user, never root; the right to bind ports below 1024 and nothing else.
          test "$(systemctl show -p User --value oadm-site-node)" = oadm-site-node
          test "$(ps -o user:32= -C oadm-site-node | head -n 1)" = oadm-site-node
          systemctl show -p AmbientCapabilities --value oadm-site-node | grep -q cap_net_bind_service
          test -S /run/oadm-site-node/admin.sock
          sudo ls -la /var/lib/oadm-site-node
          test "$(sudo stat -c %a /var/lib/oadm-site-node)" = 700
          test "$(sudo stat -c %U /var/lib/oadm-site-node)" = oadm-site-node
          sudo test -f /var/lib/oadm-site-node/node.json
          # A change needs root (or the service user): refused for this user, done with sudo.
          ! oadm-site-node server 127.0.0.1
          sudo oadm-site-node server 127.0.0.1
          oadm-site-node status | grep -q 'Server: 127.0.0.1'
          test -x /opt/oadm/site-node-app/oadm-site-node-app && test -L /usr/bin/oadm-site-node-app
          test -s /usr/share/doc/oadm-site-node/THIRD-PARTY-NOTICES.txt && test ! -e /opt/oadm/site-node/LGPL-2.1.txt
          sudo apt-get remove -y oadm-site-node-app oadm-site-node
          ! systemctl is-active oadm-site-node
          test ! -e /usr/bin/oadm-site-node
          sudo test -f /var/lib/oadm-site-node/node.json
          echo "site node: install, service, status, remove ok"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oadm-${{ steps.version.outputs.version }}-${{ matrix.rid }}
          path: artifacts/packages/*
          if-no-files-found: error

      # Their own artifact: smoke-windows downloads only the MSI; the release job takes every artifact.
      - name: Upload portable archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portable-${{ steps.version.outputs.version }}-${{ matrix.rid }}
          path: artifacts/portable-zips/*
          if-no-files-found: error

  # The MSIs (OADM, OADM Site Node) installed, checked and removed on a fresh runner: a job of its own, so a runner that stops answering fails
  # after 30 minutes instead of the installer job's 60, and "Re-run failed jobs" repeats only this job and the release.
  # packaging/windows/smoke.ps1 prints the time on every line and a heartbeat while a program runs.
  smoke-windows:
    name: smoke windows win-x64
    needs: installers
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: packaging/windows/smoke.ps1
          sparse-checkout-cone-mode: false

      - name: Download the MSIs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: oadm-*-win-x64
          path: installers
          merge-multiple: true

      - name: Smoke test (Windows MSI, server and client)
        shell: pwsh
        timeout-minutes: 12
        run: ./packaging/windows/smoke.ps1 -Msi (Get-ChildItem installers/OADM-*.msi | Where-Object Name -notlike 'OADM-SiteNode-*' | Select-Object -First 1).FullName -Mode ServerAndClient

      - name: Smoke test (Windows MSI, client only)
        shell: pwsh
        timeout-minutes: 8
        run: ./packaging/windows/smoke.ps1 -Msi (Get-ChildItem installers/OADM-*.msi | Where-Object Name -notlike 'OADM-SiteNode-*' | Select-Object -First 1).FullName -Mode ClientOnly

      - name: Smoke test (Windows MSI, site node)
        shell: pwsh
        timeout-minutes: 8
        run: ./packaging/windows/smoke.ps1 -Msi (Get-ChildItem installers/OADM-SiteNode-*.msi | Select-Object -First 1).FullName -Mode SiteNode

  # Classic GitHub release for the tag with the installers and their SHA-256 checksums, only when the tests and every
  # installer job succeeded. A moved tag (re-run of the same version) replaces the files of the existing release.
  # The plugin SDK packages, checked before the release exists: packed with the tag's version, every template created,
  # built and tested against them (only these packages: nuget.org may hold an older copy of the same version). Uploaded
  # for the job nuget.
  nuget-pack:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Pack
        run: ./manage.sh package nuget --version "${GITHUB_REF_NAME#v}"

      - name: Templates build and pass their tests with these packages
        run: |
          version="${GITHUB_REF_NAME#v}"
          work="$RUNNER_TEMP/templates"
          mkdir -p "$work"
          dotnet new install "artifacts/nuget/Oadm.Plugin.Templates.$version.nupkg" --debug:custom-hive "$work/hive"
          for kind in task page action; do
            (
              cd "$work"
              dotnet new "oadm-$kind" -n "Check${kind^}" --debug:custom-hive "$work/hive"
              cd "Check${kind^}"
              cat > nuget.config <<EOF
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="$GITHUB_WORKSPACE/artifacts/nuget" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="local"><package pattern="Oadm.*" /></packageSource>
              <packageSource key="nuget.org"><package pattern="*" /></packageSource>
            </packageSourceMapping>
          </configuration>
          EOF
              dotnet build
              dotnet test --no-build
              test -f ".oadm/plugins/community.check-$kind/plugin.json"
            )
          done

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-packages
          path: artifacts/nuget/*.nupkg
          if-no-files-found: error

  release:
    needs: [tests, installers, smoke-windows, nuget-pack]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Download installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{oadm,portable}-*"
          path: installers
          merge-multiple: true

      # The release text is the section "## [X.Y.Z]" of CHANGELOG.md (up to the next "## [" heading); without one the
      # release falls back to GitHub's generated notes.
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found && substr($0, 1, 1) == "[" && index($0, "]: ") > 0 { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ] && grep -q '[^[:space:]]' release-notes.md; then
            echo "Release notes from CHANGELOG.md:"; cat release-notes.md
          else
            echo "CHANGELOG.md has no section for $version: GitHub's generated notes are used."
            rm -f release-notes.md
          fi

      - name: Checksums
        working-directory: installers
        run: |
          sha256sum -- * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cat SHA256SUMS.txt

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          ls -l installers
          if [ -f release-notes.md ]; then notes=(--notes-file release-notes.md); else notes=(--generate-notes); fi
          # A pre-release (v3.5.0-rc.1) never becomes the latest release: the website's download buttons and the
          # "latest" links stay on the last real release.
          case "$version" in *-*) kind=(--prerelease --latest=false) ;; *) kind=(--latest) ;; esac
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" installers/* --clobber
            gh release edit "$tag" "${kind[@]}"
            if [ -f release-notes.md ]; then gh release edit "$tag" --notes-file release-notes.md; fi
          else
            gh release create "$tag" installers/* --title "OADM $version" "${notes[@]}" "${kind[@]}" --verify-tag
          fi

  # The plugin SDK on nuget.org (website dev/plugin-sdk.md), only after the release exists: the packages job nuget-pack built
  # and checked. NuGet Trusted Publishing: no API key in GitHub; the job trades its OIDC token for a key that lives one
  # hour. Needs the repository variable NUGET_USER (the nuget.org account) and a trusted publishing policy for this
  # repository and release.yml on nuget.org; without the variable the job is skipped. Versions on nuget.org never change:
  # a re-run of a moved tag keeps the packages pushed first (--skip-duplicate says so).
  nuget:
    needs: [release, nuget-pack]
    # A release candidate tests the installers only: nuget.org keeps every version forever.
    if: vars.NUGET_USER != '' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-packages
          path: nuget

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: NuGet login (Trusted Publishing)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "nuget/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
