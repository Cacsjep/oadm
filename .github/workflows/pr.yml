name: pr

# Builds and unit-tests every pull request (Dependabot updates included) on Linux before it is merged. The full matrix
# with the installers runs only for release tags (release.yml). Tests that depend on real elapsed time stay local.
# A pull request that changes only the website, docs/, Markdown files or the release and Pages workflows skips build
# and tests; the job still reports, because it is the required check on main.
# Also started by vulnerabilities.yml on its branch (workflow_dispatch: a pull request opened with a workflow's token starts
# no workflow); then it always builds and tests.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: changes
        name: check for changes outside the website
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE"...HEAD | grep -qvE '^(website/|docs/|\.github/workflows/(pages|release)\.yml$)|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only the website changed: no build and tests."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.code == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # The Text recognition models are downloaded at build (plugins/Oadm.Plugins.Ocr/Models/README.md), kept between runs.
      - if: steps.changes.outputs.code == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/oadm/models
          key: oadm-models-${{ runner.os }}-${{ hashFiles('plugins/Oadm.Plugins.Ocr/Models/Models.targets') }}
      - if: steps.changes.outputs.code == 'true'
        run: dotnet build Oadm.sln -c Release
      - if: steps.changes.outputs.code == 'true'
        run: dotnet test Oadm.sln -c Release --no-build --filter "Category!=Hardware&Category!=Perf&Category!=HardwareWrite&Category!=RealModel" --blame-hang-timeout 5m --blame-crash --blame-crash-dump-type mini
      - name: Upload crash dumps and test sequences
        if: failure() && steps.changes.outputs.code == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: tests/**/TestResults/**
          if-no-files-found: ignore
          retention-days: 14
