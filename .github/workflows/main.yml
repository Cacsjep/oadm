name: main

# Builds and unit-tests every push to main on Windows, Linux and macOS, with the test job of release.yml: a test that only
# fails on one system shows hours before a release tag does. A newer push cancels the run of the older one. A push that
# changes only the website, docs/, Markdown files or the release and Pages workflows starts nothing.
on:
  push:
    branches: [main]
    paths-ignore: ['website/**', 'docs/**', '**/*.md', '.github/workflows/pages.yml', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-tests
  cancel-in-progress: true

jobs:
  tests:
    name: tests ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # The Text recognition models are downloaded at build (plugins/Oadm.Plugins.Ocr/Models/README.md), kept between runs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/oadm/models
            ~/AppData/Local/Oadm/model-cache
          key: oadm-models-${{ runner.os }}-${{ hashFiles('plugins/Oadm.Plugins.Ocr/Models/Models.targets') }}
      - run: dotnet build Oadm.sln -c Release
      # The same run as the tests job of release.yml: unit tests only, once, no retry.
      - run: dotnet test Oadm.sln -c Release --no-build --filter "Category!=Hardware&Category!=Perf&Category!=HardwareWrite&Category!=RealModel" --blame-hang-timeout 5m --blame-crash --blame-crash-dump-type mini
      - name: Upload crash dumps and test sequences
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: tests/**/TestResults/**
          if-no-files-found: ignore
          retention-days: 14
