name: ci

# Runs only for release tags (v0.0.1, v1.2.0, ...): build and unit tests on Windows, Linux and macOS.
on:
  push:
    tags: ['v*.*.*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet build Oadm.sln -c Release
      # Unit tests only (like manage test unit): Perf tests have time budgets made for a developer machine and run with
      # manage test perf; hardware tests need real devices.
      - run: dotnet test Oadm.sln -c Release --no-build --filter "Category!=Hardware&Category!=Perf&Category!=HardwareWrite"
