name: ci

on:
  push:
    branches: [main, ci-datetime-tz]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet build Oadm.sln -c Release
      # Unit tests only (like manage test unit): Perf tests have time budgets made for a developer machine and run with
      # manage test perf; hardware tests need real devices.
      - run: dotnet test tests/Oadm.Plugins.DateTime.Tests -c Release --no-build --filter "Category!=Hardware&Category!=Perf&Category!=HardwareWrite"
      - run: dotnet test tests/Oadm.Plugins.NtpServer.Tests -c Release --no-build --filter "Category!=Hardware&Category!=Perf&Category!=HardwareWrite"
