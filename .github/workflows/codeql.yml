name: codeql

# Static security analysis of the C# code (GitHub CodeQL, free for public repositories). Results appear in the
# repository's Security tab. Changes without C# (website, docs, Markdown, the release and Pages workflows) skip it.
on:
  push:
    branches: [main]
    paths-ignore: ['website/**', 'docs/**', '**/*.md', '.github/workflows/pages.yml', '.github/workflows/release.yml']
  pull_request:
    branches: [main]
    paths-ignore: ['website/**', 'docs/**', '**/*.md', '.github/workflows/pages.yml', '.github/workflows/release.yml']
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze csharp
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: csharp
          build-mode: manual
      - run: dotnet build Oadm.sln -c Release -p:OadmSkipPluginDeploy=true
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:csharp
